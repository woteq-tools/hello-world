<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <meta name="description" content="Hello World — GitHub Pages site for woteq-tools.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127881;</text></svg>">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --border: #30363d;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
        --border: #d1d9e0;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    main { text-align: center; max-width: 40rem; }
    h1 {
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      margin: 0 0 0.25rem;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    p.lead {
      color: var(--muted);
      font-size: 1.125rem;
      margin: 0 0 2rem;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      background: color-mix(in srgb, var(--fg) 8%, transparent);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.15rem 0.4rem;
      font-size: 0.9em;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Hello, <span>World</span>!</h1>
    <p class="lead">This page is live on GitHub Pages.</p>
    <p>Served from the <code>woteq-tools/hello-world</code> repository.</p>
    <footer>
      Deployed with GitHub Pages &middot; <a href="https://github.com/woteq-tools/hello-world">View source</a>
    </footer>
  </main>
</body>
</html>
